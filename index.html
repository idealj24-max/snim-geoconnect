<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNIM GeoConnect Mobile - Édition Terrain v2.0</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --snim-blue: #003366;
            --snim-gold: #f39c12;
            --snim-bg: #f4f6f9;
            --success: #27ae60;
            --danger: #e74c3c;
            --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--snim-bg);
            color: #333;
            padding-bottom: 30px;
        }

        /* Header SNIM */
        .header {
            background: var(--snim-blue);
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .container {
            max-width: 500px;
            margin: 12px auto;
            padding: 0 12px;
        }

        /* Barre de statut réseau */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9em;
            font-weight: 600;
            box-shadow: var(--card-shadow);
        }

        .online { color: var(--success); }
        .offline { color: var(--danger); }

        /* Cartes de section */
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            border-top: 4px solid var(--snim-blue);
        }

        .card.warning-card {
            border-top-color: var(--snim-gold);
        }

        .card-title {
            font-size: 1.05em;
            font-weight: bold;
            color: var(--snim-blue);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.88em;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95em;
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        /* Case à cocher HSE */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: var(--danger);
            font-weight: bold;
            font-size: 0.9em;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        /* Boutons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.85; }

        .btn-save {
            background: var(--snim-blue);
            color: white;
        }

        .btn-sync {
            background: var(--snim-gold);
            color: white;
            margin-bottom: 16px;
        }

        .btn-export {
            background: #1e7e34;
            color: white;
            margin-bottom: 12px;
        }

        /* Historique des relevés */
        .releve-item {
            border-left: 4px solid var(--snim-blue);
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.88em;
        }

        .releve-item.hse-alert {
            border-left-color: var(--danger);
            background: #fff5f5;
        }

        .releve-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 8px;
        }

        .releve-date {
            font-size: 0.78em;
            color: #777;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        🛠️ SNIM GeoConnect Terrain v2.0
    </div>

    <div class="container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>Réseau : <span id="network-status" class="online">EN LIGNE</span></span>
            <span>Stockés : <span id="local-count">0</span></span>
        </div>

        <!-- Identité Géologue -->
        <div class="card">
            <div class="card-title">👤 Identité Géologue Terrain</div>
            <div style="display: flex; gap: 8px;">
                <div class="form-group" style="flex: 1;">
                    <label for="matricule">Matricule SNIM</label>
                    <input type="text" id="matricule" value="M-84920" placeholder="M-XXXXX">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label for="nom">Nom & Prénom</label>
                    <input type="text" id="nom" value="Idrissa sall" placeholder="Nom complet">
                </div>
            </div>
            <div class="form-group">
                <label for="site">Site Mier / Exploitation</label>
                <select id="site">
                    <option value="Zouérate - Mine T014">Zouérate - Mine T014</option>
                    <option value="Zouérate - TO14 West">Zouérate - TO14 West</option>
                    <option value="Guelb El Rhein">Guelb El Rhein</option>
                    <option value="Atomai / M'Haoudat">Atomai / M'Haoudat</option>
                    <option value="Port Minéralier Nouadhibou">Port Minéralier Nouadhibou</option>
                </select>
            </div>
        </div>

        <!-- Formulaire Saisie -->
        <div class="card">
            <div class="card-title">📍 Saisie Relevé Géologique</div>
            
            <div class="form-group">
                <label for="type-roche">Type de Roche / Minerai</label>
                <select id="type-roche">
                    <option value="Hématite Haute Teneur (Rich Ore)">Hématite Haute Teneur (Rich Ore)</option>
                    <option value="Magnetite (Guelb)">Magnetite (Guelb)</option>
                    <option value="Quartzite BIF (Itabirite)">Quartzite BIF (Itabirite)</option>
                    <option value="Schiste / Stérile">Schiste / Stérile</option>
                    <option value="Alluvion / Minerai Siliceux">Alluvion / Minerai Siliceux</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gps">Coordonnées GPS</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="gps" value="22.748300, -12.472200 (Mode Démo Zouérate)" readonly>
                    <button type="button" onclick="getGPS()" style="padding: 0 10px; border-radius:6px; border:1px solid #ccc; background:#eee;">🔄</button>
                </div>
            </div>

            <div class="form-group">
                <label for="photo">📸 Photo du Spécimen / Fissure HSE</label>
                <input type="file" id="photo" accept="image/*" capture="environment" onchange="previewImage(event)">
            </div>

            <div class="form-group">
                <label for="notes">Notes & Observations Terrain</label>
                <textarea id="notes" placeholder="Structure, pendage, état de la fracture..."></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="hse-danger">
                <label for="hse-danger" style="color: var(--danger); margin:0;">🚨 Signalement Danger HSE (Fissure / Éboulement)</label>
            </div>

            <button type="button" class="btn btn-save" onclick="saveReleve()">
                💾 Enregistrer sur Mobile (Offline)
            </button>
        </div>

        <!-- Bouton Sync Remote -->
        <button type="button" class="btn btn-sync" onclick="syncWithSNIM()">
            🔄 Synchroniser avec la Base SNIM
        </button>

        <!-- Historique & Export -->
        <div class="card warning-card">
            <div class="card-title">💾 Historique Local & Export SIG</div>
            
            <button type="button" class="btn btn-export" onclick="exportCSV()">
                📊 Exporter Données (CSV / Excel / QGIS)
            </button>

            <div id="releves-list">
                <!-- Les relevés s'afficheront ici dynamiquement -->
            </div>
        </div>
    </div>

    <script>
        let currentPhotoBase64 = "";

        // Détection de l'état du réseau
        function updateNetworkStatus() {
            const statusEl = document.getElementById('network-status');
            if (navigator.onLine) {
                statusEl.textContent = 'EN LIGNE';
                statusEl.className = 'online';
            } else {
                statusEl.textContent = 'HORS LIGNE';
                statusEl.className = 'offline';
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // Geolocation GPS
        function getGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude.toFixed(6);
                        const lng = pos.coords.longitude.toFixed(6);
                        document.getElementById('gps').value = `${lat}, ${lng}`;
                    },
                    (err) => {
                        console.warn("GPS non disponible, mode conservé.");
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }

        // Conversion Photo en Base64
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPhotoBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Charger l'historique au démarrage
        function loadReleves() {
            const releves = JSON.parse(localStorage.getItem('snim_releves') || '[]');
            document.getElementById('local-count').textContent = releves.length;
            
            const listEl = document.getElementById('releves-list');
            listEl.innerHTML = '';

            releves.slice().reverse().forEach(r => {
                const item = document.createElement('div');
                item.className = `releve-item ${r.hseAlert ? 'hse-alert' : ''}`;
                item.innerHTML = `
                    <strong>${r.typeRoche}</strong> ${r.hseAlert ? '🚨' : ''}<br>
                    👤 <strong>Par :</strong> ${r.nomGeologue} (${r.matricule})<br>
                    📍 <strong>GPS :</strong> ${r.gps}<br>
                    ${r.notes ? `📝 <em>${r.notes}</em><br>` : ''}
                    ${r.photo ? `<img src="${r.photo}" class="releve-img" alt="Spécimen">` : ''}
                    <div class="releve-date">${r.dateHeure}</div>
                `;
                listEl.appendChild(item);
            });
        }

        // Enregistrer un nouveau relevé
        function saveReleve() {
            const matricule = document.getElementById('matricule').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const site = document.getElementById('site').value;
            const typeRoche = document.getElementById('type-roche').value;
            const gps = document.getElementById('gps').value;
            const notes = document.getElementById('notes').value.trim();
            const hseAlert = document.getElementById('hse-danger').checked;

            if (!matricule || !nom) {
                alert("Veuillez remplir le matricule et le nom du géologue.");
                return;
            }

            const newReleve = {
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16),
                matricule,
                nomGeologue: nom,
                site,
                typeRoche,
                gps,
                notes,
                hseAlert,
                photo: currentPhotoBase64,
                dateHeure: new Date().toISOString()
            };

            const releves = JSON.parse(localStorage.getItem('snim_releves') || '[]');
            releves.push(newReleve);
            localStorage.setItem('snim_releves', JSON.stringify(releves));

            // Réinitialiser champs optionnels
            document.getElementById('notes').value = '';
            document.getElementById('hse-danger').checked = false;
            document.getElementById('photo').value = '';
            currentPhotoBase64 = '';

            loadReleves();
            alert("Relevé enregistré localement !");
        }

        // Synchronisation distante (Simulation / Supabase Hook)
        function syncWithSNIM() {
            const releves = JSON.parse(localStorage.getItem('snim_releves') || '[]');
            if (releves.length === 0) {
                alert("Aucun relevé en attente de synchronisation.");
                return;
            }

            if (!navigator.onLine) {
                alert("Pas de connexion internet disponible. Conservez les données en local.");
                return;
            }

            // Remplacez cette section avec votre appel API Supabase/Node.js backend
            alert(`Synchronisation de ${releves.length} relevé(s) vers le serveur central SNIM réussie !`);
        }

        // Exportation au format CSV sécurisé (BOM UTF-8)
        function exportCSV() {
            const releves = JSON.parse(localStorage.getItem('snim_releves') || '[]');
            if (releves.length === 0) {
                alert("Aucune donnée à exporter.");
                return;
            }

            let csvContent = "\uFEFF"; // UTF-8 BOM pour compatibilité Excel
            csvContent += "ID_Releve;Matricule_SNIM;Nom_Geologue;Site;Type_Roche;Coordonnees_GPS;Alerte_HSE;Notes;Date_Heure\n";

            releves.forEach(r => {
                const row = [
                    `"${r.id}"`,
                    `"${r.matricule}"`,
                    `"${r.nomGeologue}"`,
                    `"${r.site}"`,
                    `"${r.typeRoche}"`,
                    `"${r.gps}"`,
                    `"${r.hseAlert ? 'OUI' : 'NON'}"`,
                    `"${r.notes.replace(/"/g, '""')}"`,
                    `"${r.dateHeure}"`
                ];
                csvContent += row.join(";") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0,10);
            a.href = url;
            a.download = `SNIM_Releves_Geologiques_${dateStr}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Initialisation
        window.onload = function() {
            updateNetworkStatus();
            getGPS();
            loadReleves();
        };
    </script>
</body>
</html>
